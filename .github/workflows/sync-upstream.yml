name: Sync discretionary-tools with ocaml/dune

on:
  schedule:
    - cron: '0 7 * * *' # Every day at 7:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'tarides/dune'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: discretionary-tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: discretionary-tools
          fetch-depth: 0
          filter: blob:none
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/ocaml/dune.git
          git fetch --filter=blob:none upstream main
          if git merge --no-edit upstream/main; then
            git push origin HEAD:$BRANCH
          else
            git push origin upstream/main:refs/heads/sync-upstream
            gh pr list --head sync-upstream --state open | grep -q . ||
            gh pr create --base $BRANCH --head sync-upstream \
              --title "Sync $BRANCH with ocaml/dune (conflicts)" \
              --body "ocaml/dune main could not be merged into $BRANCH automatically. Merge $BRANCH into this branch, resolve the conflicts, and merge this PR."
          fi
