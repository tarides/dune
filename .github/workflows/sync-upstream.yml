name: Sync with ocaml/dune

on:
  schedule:
    - cron: '0 7 * * *' # Every day at 7:00 UTC
  workflow_dispatch:

# SYNC_TOKEN is a fine-grained PAT for tarides/dune with read/write access to
# Contents, Workflows and Pull requests. The default GITHUB_TOKEN cannot push
# commits that touch .github/workflows, which upstream regularly does.

jobs:
  sync:
    if: github.repository == 'tarides/dune'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: [main, discretionary-tools]
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      BRANCH: ${{ matrix.branch }}
      SYNC_BRANCH: sync-upstream-${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0
          filter: blob:none
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/ocaml/dune.git
          git fetch --filter=blob:none upstream main

          # Last resort when nothing can be pushed to this repository: a PR
          # whose head is ocaml/dune itself. Nobody can push to that head,
          # so conflicts cannot be resolved on it, but a clean merge can
          # still be done from the GitHub UI.
          pr_from_ocaml_main () {
            gh pr list --base "$BRANCH" --state open \
              --json headRepositoryOwner,headRefName \
              --jq '.[] | select(.headRepositoryOwner.login == "ocaml" and .headRefName == "main")' |
            grep -q . ||
            gh pr create --base "$BRANCH" --head ocaml:main \
              --title "Sync $BRANCH with ocaml/dune" \
              --body "ocaml/dune main could not be pushed to $BRANCH automatically. Merge this PR from the GitHub UI."
          }

          if git merge --no-edit upstream/main; then
            git push origin HEAD:"$BRANCH" || pr_from_ocaml_main
            exit 0
          fi

          # Conflicts: put upstream/main on a branch in this repository and
          # open a PR from it, so the conflicts can be resolved on the PR
          # (by a human or by Copilot).
          git merge --abort
          if gh pr list --base "$BRANCH" --head "$SYNC_BRANCH" --state open | grep -q .; then
            echo "An open PR from $SYNC_BRANCH already exists; leaving it alone."
            exit 0
          fi
          # Any previous PR from this branch is closed, so drop its branch
          # rather than trying to fast-forward over its resolution commits.
          git push origin --delete "$SYNC_BRANCH" 2>/dev/null || true
          git push origin upstream/main:refs/heads/"$SYNC_BRANCH" || {
            pr_from_ocaml_main
            exit 0
          }
          gh pr create --base "$BRANCH" --head "$SYNC_BRANCH" \
            --title "Sync $BRANCH with ocaml/dune (conflicts)" \
            --body "ocaml/dune main could not be merged into $BRANCH automatically. Merge $BRANCH into this branch, resolve the conflicts, and merge this PR."
